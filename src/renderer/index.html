<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>配额小组件</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="frame" id="frame">
      <header class="titlebar">
        <span class="source-pill" id="sourcePill">Hermes</span>
        <span class="hint">右键切换来源</span>
      </header>
      <div class="loading" id="loading">正在读取配额…</div>
      <main class="dashboard hidden" id="dashboard">
        <section class="panel grok-panel" id="grokPanel">
          <div class="panel-head">
            <span class="logo grok-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 1.6 14.7 9.3 22.4 12 14.7 14.7 12 22.4 9.3 14.7 1.6 12 9.3 9.3Z"
                />
              </svg>
            </span>
          </div>
          <div class="accounts" id="grokAccounts"></div>
        </section>
        <section class="panel gpt-panel" id="gptPanel">
          <div class="panel-head">
            <span class="logo gpt-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <g fill="currentColor">
                  <circle cx="12" cy="12" r="2.1" />
                  <circle cx="12" cy="4.4" r="1.35" />
                  <circle cx="18.6" cy="8.2" r="1.35" />
                  <circle cx="18.6" cy="15.8" r="1.35" />
                  <circle cx="12" cy="19.6" r="1.35" />
                  <circle cx="5.4" cy="15.8" r="1.35" />
                  <circle cx="5.4" cy="8.2" r="1.35" />
                </g>
              </svg>
            </span>
          </div>
          <div class="accounts" id="gptAccounts"></div>
        </section>
      </main>
    </div>
    <script src="./gauges.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
